<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Список модов — Cyberpunk 2077</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080c;
  --text:#e6e8ee;
  --dim:#9097a5;
  --faint:#5f6572;
  --line:rgba(236,238,245,.22);
  --line2:rgba(236,238,245,.11);
  --rh:1.55rem;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace;
  --disp:'Exo 2','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{font-size:clamp(9px,min(.8333vw,1.5625vh),22px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* ---------- фон ---------- */
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#0d0f16 0%,#07080c 60%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.b1{width:46vw;height:46vw;left:-12vw;top:-18vw;background:radial-gradient(circle,rgba(150,165,205,.20),transparent 68%);animation:d1 38s ease-in-out infinite alternate}
.b2{width:40vw;height:40vw;right:-10vw;top:12vh;background:radial-gradient(circle,rgba(190,170,210,.13),transparent 68%);animation:d2 46s ease-in-out infinite alternate}
.b3{width:50vw;height:34vw;left:22vw;bottom:-22vw;background:radial-gradient(circle,rgba(130,170,190,.14),transparent 70%);animation:d3 52s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(9vw,7vh)}}
@keyframes d2{to{transform:translate(-8vw,9vh)}}
@keyframes d3{to{transform:translate(-10vw,-6vh)}}
.grid{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(236,238,245,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(236,238,245,.028) 1px,transparent 1px);
  background-size:3rem 3rem;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 85%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 85%)}
.vig{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%)}

/* ---------- каркас ---------- */
.page{min-height:100vh;max-width:120rem;margin:0 auto;padding:1.6rem 2.5rem;display:flex;flex-direction:column;justify-content:center;gap:1.9rem}

/* ---------- верхняя полоса ---------- */
.top{position:relative;z-index:30;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem;align-items:center;height:7.4rem}
.hd{grid-column:1;justify-self:start;display:grid;gap:.9rem;width:max-content;max-width:100%}
h1{margin:0;text-align:center;font-family:var(--disp);font-weight:600;font-size:2.5rem;line-height:1.05;letter-spacing:.1em;color:#eceef3;text-transform:uppercase;padding-left:.1em;text-shadow:0 0 1.6rem rgba(220,226,240,.18);white-space:nowrap}
.tags{width:0;min-width:100%;display:flex;gap:.35rem}
.tag{flex:1 1 auto;text-align:center;white-space:nowrap;font-family:var(--mono);font-size:.56rem;letter-spacing:.06em;text-transform:uppercase;color:#c4c9d4;border:1px solid var(--line);border-radius:999px;padding:.32rem .15rem;background:rgba(255,255,255,.03);backdrop-filter:blur(.5rem);-webkit-backdrop-filter:blur(.5rem)}
.mid{grid-column:2 / span 2;position:relative;display:flex;justify-content:center;align-items:center;height:100%}

/* ---------- поиск ---------- */
.search{position:relative;display:flex;align-items:center;gap:.65rem;width:24rem;height:2.6rem;padding:0 1.05rem;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.035);backdrop-filter:blur(.8rem);-webkit-backdrop-filter:blur(.8rem);cursor:text;
  transition:border-color .35s ease,box-shadow .35s ease,background-color .35s ease}
.search:focus-within{border-color:rgba(236,238,245,.55);background:rgba(255,255,255,.055);box-shadow:0 0 1.8rem rgba(220,228,255,.10)}
.search svg{flex:none;width:1rem;height:1rem;fill:none;stroke:var(--dim);stroke-width:1.7;stroke-linecap:round;transition:stroke .3s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.search:focus-within svg{stroke:#fff;transform:scale(1.1) rotate(-8deg)}
.field{position:relative;flex:1;height:100%;min-width:0;font-family:var(--mono);font-size:.9rem;letter-spacing:.04em}
.field input,.ghost,.ph{position:absolute;inset:0;display:flex;align-items:center;white-space:pre;font:inherit;letter-spacing:inherit;margin:0}
.field input{width:100%;border:0;outline:0;background:transparent;color:transparent;caret-color:#fff;padding:0}
.ghost{pointer-events:none;color:#eef0f5;overflow:hidden}
.ghost .g{display:inline-block;white-space:pre}
.ghost .g.in{animation:typein .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes typein{from{opacity:0;transform:translateY(.6em) scale(.8);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
.ph{pointer-events:none;color:var(--faint);transition:opacity .25s ease}
.search.has .ph{opacity:0}
.qc{flex:none;min-width:1.5rem;text-align:right;font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;color:var(--dim);transition:color .3s ease}
.search.none{border-color:rgba(236,238,245,.12)}
.search.none .qc{color:var(--faint)}
.search.none .field{animation:nope .38s ease}
@keyframes nope{25%{transform:translateX(-.25rem)}60%{transform:translateX(.2rem)}}

/* ---------- доска ---------- */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem}
.card{position:relative;display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:.6rem;padding:.2rem .5rem .5rem;
  background:rgba(255,255,255,.032);backdrop-filter:blur(1rem) saturate(1.15);-webkit-backdrop-filter:blur(1rem) saturate(1.15);
  animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.card::before,.card::after{content:"";position:absolute;width:.7rem;height:.7rem;border:1px solid rgba(255,255,255,.75);opacity:.65;pointer-events:none}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:.6rem}
.card::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-bottom-right-radius:.6rem}
@keyframes rise{from{opacity:0;transform:translateY(.7rem)}to{opacity:1;transform:none}}
.ch{display:flex;align-items:center;justify-content:space-between;gap:.6rem;height:2.3rem;padding:0 .6rem;margin-bottom:.35rem;border-bottom:1px solid var(--line2)}
.ch h2{margin:0;min-width:0;font-family:var(--mono);font-weight:500;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:#eceef3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch h2 i{font-style:normal;color:var(--faint);white-space:pre}
.ct{flex:none;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;color:var(--dim);border:1px solid var(--line2);border-radius:999px;padding:.12rem .55rem}
.list{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--r),var(--rh));grid-auto-columns:minmax(0,1fr);column-gap:.5rem}

/* ---------- строка мода ---------- */
a.mod{position:relative;display:flex;align-items:center;gap:.5rem;height:var(--rh);padding:0 .65rem;border-radius:.35rem;color:var(--dim);text-decoration:none;white-space:nowrap;overflow:hidden;outline:none;
  transition:color .25s ease,opacity .35s ease,background-color .35s ease}
a.mod::before{content:"";position:absolute;left:0;top:50%;width:2px;height:56%;background:#fff;border-radius:2px;transform:translateY(-50%) scaleY(0);transform-origin:center;transition:transform .28s cubic-bezier(.2,.8,.2,1);opacity:.85}
a.mod::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.10),rgba(255,255,255,0) 75%);opacity:0;transition:opacity .3s ease;pointer-events:none}
a.mod .nm{flex:1;min-width:0;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
a.mod .ar{flex:none;font-size:.78rem;opacity:0;transform:translate(-.3rem,.15rem);transition:opacity .25s ease,transform .28s cubic-bezier(.2,.8,.2,1)}
a.mod:hover,a.mod:focus-visible{color:#fff}
a.mod:hover::before,a.mod:focus-visible::before{transform:translateY(-50%) scaleY(1)}
a.mod:hover::after,a.mod:focus-visible::after{opacity:1}
a.mod:hover .nm,a.mod:focus-visible .nm{transform:translateX(.3rem)}
a.mod:hover .ar,a.mod:focus-visible .ar{opacity:.9;transform:none}
.board.focus a.mod:not(.hot){opacity:.5}

/* посимвольная подсветка поиска */
.nm .c{background:linear-gradient(currentColor,currentColor) 0 100%/0% 1px no-repeat;transition:color .38s ease,text-shadow .38s ease,background-size .38s ease;transition-delay:calc(var(--d,0)*26ms)}
.nm .c.m{color:#fff;text-shadow:0 0 .6rem rgba(255,255,255,.6);background-size:100% 1px}
a.mod.sm{color:var(--text);background:rgba(255,255,255,.045)}
a.mod.sm::before{transform:translateY(-50%) scaleY(.5);opacity:.6}
.board.q a.mod:not(.sm){opacity:.42}

/* ---------- звук ---------- */
.snd,.dl,.gd{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:999px;cursor:pointer;backdrop-filter:blur(.5rem);-webkit-backdrop-filter:blur(.5rem);transition:color .25s,border-color .25s,box-shadow .3s,background-color .25s;text-decoration:none}
.snd{position:absolute;left:calc(50% - 12rem);bottom:calc(50% + 1.3rem + .55rem);padding:.34rem .85rem;display:flex;align-items:center;gap:.5rem;white-space:nowrap}
.snd svg{width:.85rem;height:.85rem;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.snd .off{display:none}
.snd[aria-pressed="false"] .on{display:none}
.snd[aria-pressed="false"] .off{display:block}
.snd[aria-pressed="false"]{opacity:.65}
.snd:hover,.snd:focus-visible{color:#fff;border-color:var(--line);outline:none}
.dl{position:absolute;right:calc(50% - 12rem);top:calc(50% + 1.3rem + .55rem);display:flex;align-items:center;gap:.5rem;padding:.34rem .85rem;white-space:nowrap}
.dl svg{width:.8rem;height:.8rem;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dl:hover,.dl:focus-visible,.gd:hover,.gd:focus-visible{color:#fff;border-color:var(--line);outline:none}
.dlnote{position:absolute;left:calc(50% + 14.4rem);top:50%;width:22rem;transform:translateY(-50%);padding:.7rem .95rem .95rem;border:1px solid var(--line);border-radius:.55rem;background:#0c0d13;box-shadow:0 .8rem 2rem rgba(0,0,0,.45);font-size:.72rem;line-height:1.5;color:#d6dae3;z-index:60}
.dlnote b{display:block;margin-bottom:.3rem;font-family:var(--mono);font-weight:400;font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.dlnote .st{display:grid;grid-template-columns:.9rem 1.3rem 1fr;align-items:baseline;padding:.1rem 0}
.dlnote .st i{font-style:normal;text-align:right;color:var(--faint);font-family:var(--mono);font-size:.64rem}
.dlnote .st em{font-style:normal;text-align:center;color:var(--faint);font-family:var(--mono);font-size:.64rem}
.gd{position:absolute;right:.9rem;bottom:0;transform:translateY(50%);padding:.3rem .8rem;background:#0c0d13;white-space:nowrap;font-size:.56rem;letter-spacing:.14em}

/* ---------- ник, портал, диалог ---------- */
.nick{position:fixed;left:0;top:0;z-index:80;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform}
.nick.drag{cursor:grabbing}
.nick-in{position:relative;padding:.42rem .95rem;border:1px solid rgba(236,238,245,.6);border-radius:.4rem;background:rgba(14,15,21,.78);backdrop-filter:blur(.6rem);-webkit-backdrop-filter:blur(.6rem);color:#fff;font-family:var(--mono);font-size:.9rem;letter-spacing:.08em;white-space:nowrap;box-shadow:0 .5rem 1.4rem rgba(0,0,0,.45),0 0 1.2rem rgba(200,225,255,.12);text-shadow:-1px 0 rgba(143,233,255,.55),1px 0 rgba(255,143,214,.45)}
.nick-in .nm0{display:block;transition:opacity .18s ease}
.nick-in .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .18s ease;white-space:nowrap;letter-spacing:0;font-size:1.05rem;pointer-events:none}
.nick-in .face b{display:block;font-weight:400}
.nick.talk .nm0{opacity:0}
.nick.talk .face{opacity:1}
.face.m-a b{animation:fsh .1s linear infinite}
.face.m-s b{animation:fsh .07s linear infinite}
.face.m-z b{animation:fbob 1.8s ease-in-out infinite}
.face.m-d b{animation:fdz .9s linear infinite}
.face.m-f b,.face.m-l b{animation:fbob .6s ease-in-out infinite}
.face.gl b{animation:fgl .32s steps(1) 1!important}
@keyframes fsh{0%{transform:translate(-1px,0)}50%{transform:translate(1px,-1px)}100%{transform:translate(-1px,1px)}}
@keyframes fbob{50%{transform:translateY(-.12rem)}}
@keyframes fdz{from{transform:rotate(-4deg)}50%{transform:rotate(4deg)}to{transform:rotate(-4deg)}}
@keyframes fgl{0%{transform:translate(-3px,0) skewX(16deg);filter:hue-rotate(90deg)}25%{transform:translate(3px,1px) skewX(-14deg);opacity:.4}50%{transform:translate(-2px,-1px);filter:none}75%{transform:translate(2px,0) skewX(8deg);filter:hue-rotate(-60deg)}100%{transform:none}}
.nick.struggle .nick-in{animation:strug .09s linear infinite;border-color:rgba(255,90,110,.8)}
@keyframes strug{0%{transform:translate(-2px,1px) rotate(-3deg)}50%{transform:translate(2px,-1px) rotate(3deg)}100%{transform:translate(-1px,-1px) rotate(-2deg)}}
.nick.perch .nick-in{animation:sway 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(1.6deg)}}
/* цифровые лапки */
.legs{position:absolute;left:0;right:0;top:100%;height:0;opacity:0;transition:opacity .35s ease;pointer-events:none}
.nick.legs-on .legs{opacity:1}
.leg{position:absolute;top:-1px;width:1px;height:.95rem;background:#e6eaf2;box-shadow:0 0 4px rgba(143,233,255,.8);transform-origin:50% 0;transform:rotate(calc(var(--r)*1deg));animation:lg .5s ease-in-out infinite;animation-delay:var(--dl)}
.leg i{position:absolute;left:0;top:100%;width:1px;height:1.05rem;background:#e6eaf2;box-shadow:0 0 4px rgba(255,143,214,.7);transform-origin:50% 0;transform:rotate(calc(var(--k)*1deg))}
.nick.still .leg{animation-play-state:paused}
@keyframes lg{0%,100%{transform:rotate(calc(var(--r)*1deg))}50%{transform:rotate(calc(var(--r)*.3deg)) translateY(-.2rem)}}
/* цифровые крылья */
.wing{position:absolute;top:-30%;width:3rem;height:1.9rem;opacity:0;transition:opacity .35s ease;pointer-events:none}
.wing.l{right:100%;transform-origin:100% 70%;animation:wl .7s ease-in-out infinite alternate}
.wing.r{left:100%;transform-origin:0 70%;animation:wr .7s ease-in-out infinite alternate}
.wing svg{width:100%;height:100%;overflow:visible;fill:none;stroke:#dfe9ff;stroke-width:1;filter:drop-shadow(0 0 3px rgba(143,233,255,.85))}
.wing.r svg{transform:scaleX(-1)}
.nick.wings-on .wing{opacity:.95}
@keyframes wl{from{transform:rotate(20deg)}to{transform:rotate(-24deg)}}
@keyframes wr{from{transform:rotate(-20deg)}to{transform:rotate(24deg)}}
/* портал: тихая дыра в коде страницы */
.portal{position:fixed;z-index:75;width:6.4rem;height:6.4rem;margin:-3.2rem 0 0 -3.2rem;pointer-events:none;transform:scale(.1);opacity:0;transition:transform .6s cubic-bezier(.2,1,.3,1),opacity .45s ease;filter:drop-shadow(0 0 .9rem rgba(0,0,0,.95))}
.portal.open{transform:scale(1);opacity:1}
.portal.closing{transform:scale(.04);opacity:0;transition:transform .55s ease-in,opacity .55s ease-in}
.portal .hole{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle,#000 0,#010102 62%,#07080c 100%);animation:holej 1.2s steps(1) infinite;box-shadow:inset 0 0 1.4rem #000}
@keyframes holej{0%{clip-path:var(--h1)}34%{clip-path:var(--h2)}67%{clip-path:var(--h3)}}
.portal .code{position:absolute;left:12%;right:12%;top:0;font-family:var(--mono);font-size:.46rem;line-height:1.4;color:rgba(190,200,215,.28);white-space:pre;animation:cscroll 3.2s linear infinite;-webkit-mask:radial-gradient(circle at 50% 50%,#000 20%,transparent 70%);mask:radial-gradient(circle at 50% 50%,#000 20%,transparent 70%)}
@keyframes cscroll{from{transform:translateY(0)}to{transform:translateY(-50%)}}
.portal .fr{position:absolute;font-family:var(--mono);font-size:.55rem;color:rgba(200,208,222,.4);animation:frf 2.4s steps(2) infinite}
@keyframes frf{0%,100%{opacity:.5}50%{opacity:.1}}
.portal::before{content:"";position:absolute;inset:-4%;border-radius:50%;border:1px solid rgba(215,222,235,.28);animation:rg 5s linear infinite}
.portal::after{content:"";position:absolute;inset:-12%;border-radius:50%;border:1px dashed rgba(215,222,235,.14);animation:rg 9s linear infinite reverse}
@keyframes rg{to{transform:rotate(360deg)}}
.bubble{position:fixed;left:0;top:0;z-index:85;pointer-events:none;width:20rem;border:1px solid rgba(236,238,245,.5);border-radius:.45rem;background:rgba(12,13,19,.86);backdrop-filter:blur(.8rem);-webkit-backdrop-filter:blur(.8rem);box-shadow:0 .8rem 2rem rgba(0,0,0,.5);opacity:0;transition:opacity .3s ease}
.bubble.on{opacity:1}
.bubble .bh{display:flex;align-items:center;gap:.28rem;padding:.3rem .55rem;border-bottom:1px solid var(--line2);font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;color:var(--dim)}
.bubble .bh i{width:.32rem;height:.32rem;border:1px solid var(--dim);display:inline-block}
.bubble .bh span{margin-left:auto}
.bubble .bt{padding:.6rem .7rem .7rem;min-height:4.1rem;font-family:var(--mono);font-size:.86rem;line-height:1.5;color:#e9ecf2;transition:opacity .2s ease}

/* ---------- адаптив ---------- */
@media (max-width:1000px){
  html{font-size:15px}
  .page{padding:3.2rem 1rem 2rem;justify-content:flex-start}
  .top{display:flex;flex-direction:column;height:auto;gap:1.2rem;align-items:stretch}
  .hd{align-self:center}
  .mid{height:auto;flex-wrap:wrap;gap:.7rem;justify-content:center}
  .snd,.dl{position:static}
  .dlnote{position:relative;left:auto;top:auto;transform:none;width:100%;max-width:26rem;margin-bottom:.6rem}
  .board{grid-template-columns:minmax(0,1fr)}
  .card{grid-column:auto!important}
  .list{grid-auto-flow:row;grid-template-rows:none;grid-auto-rows:var(--rh)}
  h1{font-size:2rem}
}
@media (max-width:640px){.search{width:min(24rem,70vw)}}
@media (prefers-reduced-motion:reduce){
  .blob,.card,.leg,.wing{animation:none!important}
  a.mod,a.mod *{transition-duration:.01s!important}
}


/* ---------- плавный переход между страницами: затемняющая завеса, сама страница не трогается ---------- */
.veil{position:fixed;inset:0;z-index:200;background:#07080c;opacity:0;pointer-events:none;animation:veilout .5s ease-out both}
@keyframes veilout{from{opacity:1}to{opacity:0}}
html.leaving .veil{opacity:1!important;animation:none;transition:opacity .34s ease;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.veil{animation:none}html.leaving .veil{transition:none}}
</style>
</head>
<body>
<div class="veil" aria-hidden="true"></div>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="grid"></div><div class="vig"></div>
<main class="page">
  <header class="top">
    <div class="hd">
      <h1>Список модов</h1>
      <div class="tags" id="tags"></div>
    </div>
    <div class="mid">
      <label class="search" id="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.6"/><path d="M13 13l4.2 4.2"/></svg>
        <div class="field">
          <span class="ph">Найти мод</span>
          <div class="ghost" id="ghost" aria-hidden="true"></div>
          <input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="30" aria-label="Поиск мода по названию">
        </div>
        <span class="qc" id="qc"></span>
      </label>
      <button class="snd" id="snd" type="button" aria-pressed="true" aria-label="Звук"><svg class="on" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8v4h3l4 3.4V4.6L6 8z"/><path d="M13 7.2a4 4 0 010 5.6M15.4 5a7.2 7.2 0 010 10"/></svg><svg class="off" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8v4h3l4 3.4V4.6L6 8z"/><path d="M13.5 8l4 4M17.5 8l-4 4"/></svg><span id="sndT">Звук · вкл</span></button>

function impulse(c,sec,decay){

    nk.y=nk.plat?nk.plat.y-nk.h:B.floor;nk.t+=dt;nk.a+=(0-nk.a)*Math.min(1,dt*6);
    if(nk.t>1){var r=Math.random();if(r<.3)startWings();else if(r<.75)startJump();else startLazy()}
  }else if(m==='lazy'){
    nk.y=nk.plat?nk.plat.y-nk.h:B.floor;nk.t+=dt;nk.lift+=(0-nk.lift)*Math.min(1,dt*3);
    if(nk.t>2.2){resetAuto();nk.rest=0}
  }else if(m==='wingup'){
    nk.t+=dt;nk.lift+=(0-nk.lift)*Math.min(1,dt*4);nk.y+=((nk.plat?nk.plat.y-nk.h:B.floor)-R*2.5-nk.y)*Math.min(1,dt*2.5);
    if(nk.t>1){
      nk.mode='fly';nk.t=0;nk.wi=0;nk.wp=[];
      for(var i2=0;i2<3+(Math.random()<.5?1:0);i2++)nk.wp.push({x:innerWidth*(.06+Math.random()*.8),y:innerHeight*(.08+Math.random()*.72)});
    }
  }else if(m==='fly'||m==='land'){
    nk.t+=dt;nk.lift+=(0-nk.lift)*Math.min(1,dt*4);
    var tx,ty,k=1-Math.exp(-dt*(m==='land'?2.2:1.5)),lt=null;
    if(m==='fly'){
      var w=nk.wp[nk.wi];tx=w.x;ty=w.y;
      if(nk.t>1.8){nk.t=0;nk.wi++;if(nk.wi>=nk.wp.length){nk.mode='land';nk.t=0;pickLanding()}}
    }else{lt=landTarget(R);tx=lt.x;ty=lt.y}
    var px=nk.x;
    nk.x+=(tx-nk.x)*k;nk.y+=(ty-nk.y)*k;
    nk.a=clamp((nk.x-px)/Math.max(dt,.001)*.01,-10,10);
    nk.bob=m==='fly'?Math.sin(nk.t*3)*.3*R:0;
    if(m==='land'&&Math.hypot(tx-nk.x,ty-nk.y)<3){
      nk.x=tx;nk.y=ty;nk.a=0;nk.bob=0;nk.t=0;nk.el.classList.remove('wings-on');
      if(lt.search){
        nk.mode='perch';nk.el.classList.add('perch');playThump(.6);
        showBubble(ROAST[roastIdx++%ROAST.length],{done:function(){
          if(!nk||nk.mode!=='perch')return;
          nk.mode='perchwait';
          showBubble(rnd(DOWN),{done:function(){
            if(!nk||nk.mode!=='perchwait')return;
            nk.el.classList.remove('perch');nk.el.classList.add('wings-on');
            nk.mode='land';nk.t=0;pickLanding();if(nk.landEl==='search'){var c2=plats.filter(function(q){return q.cat!=='search'});if(c2.length){nk.landEl=rnd(c2).el;nk.lf=.15+Math.random()*.7}}
          }});
        }});
      }else{
        nk.mode='phys';nk.plat=lt.p;nk.vx=0;nk.vy=0;nk.rest=0;playThump(.4);
      }
    }
    nk.flapT-=dt;if(nk.flapT<=0){nk.flapT=.6;playFlap()}
  }else if(m==='perch'||m==='perchwait'){
    var s2=search.getBoundingClientRect();nk.x=s2.left+R*1.2;nk.y=s2.top-nk.h+1;nk.a=0;
  }
  paint();posBubble();
}
function onNickDown(e){
  if(busy||nk.frozen||e.button>0)return;
  e.preventDefault();grabs++;
  if(nk.mode!=='phys'){killBubble();resetAuto()}
  nk.lift=0;nk.plat=null;
  if(!bubble&&grabs>=2&&grabs-lastPrank>=2&&Math.random()<.34){lastPrank=grabs;prank();return}
  nk.drag=true;nk.el.classList.add('drag');nk.pid=e.pointerId;
  try{nk.el.setPointerCapture(e.pointerId)}catch(x){}
  nk.ox=e.clientX-nk.x;nk.oy=e.clientY-nk.y;nk.lt=performance.now();nk.vx=0;nk.vy=0;playGrab();
  flashFace('s',1000);
}
function onNickMove(e){
  if(!nk.drag||e.pointerId!==nk.pid)return;
  var now=performance.now(),dt=(now-nk.lt)/1000;
  var nx=clamp(e.clientX-nk.ox,2,innerWidth-nk.w-2),ny=clamp(e.clientY-nk.oy,2,innerHeight-nk.h-2);
  if(dt>0){nk.vx=nk.vx*.6+((nx-nk.x)/dt)*.4;nk.vy=nk.vy*.6+((ny-nk.y)/dt)*.4}
  nk.x=nx;nk.y=ny;nk.lt=now;
}
function onNickUp(e){
  if(!nk.drag||e.pointerId!==nk.pid)return;
  var u=unit(),cap=2600*u;
  nk.drag=false;nk.el.classList.remove('drag');nk.rest=0;
  if(performance.now()-nk.lt>90){nk.vx*=.2;nk.vy*=.2}
  nk.vx=clamp(nk.vx,-cap,cap);nk.vy=clamp(nk.vy,-cap,cap);
  var sp=Math.sqrt(nk.vx*nk.vx+nk.vy*nk.vy);
  nk.va=nk.vx*.05;
  if(sp>350*u)playWhoosh(clamp(sp/(1800*u),.3,1));else playGrab();
  if(sp>900*u)flashFace('d',1800);
  try{nk.el.releasePointerCapture(e.pointerId)}catch(x){}
}

/* ---------- портал-«дыра в коде» ---------- */
function jag(){
  var n=30,pts=[];
  for(var i=0;i<n;i++){var a=i/n*Math.PI*2,r=44+Math.random()*5;pts.push((50+Math.cos(a)*r).toFixed(1)+'% '+(50+Math.sin(a)*r).toFixed(1)+'%')}
  return 'polygon('+pts.join(',')+')';
}
root.style.setProperty('--h1',jag());root.style.setProperty('--h2',jag());root.style.setProperty('--h3',jag());
var CODE=['<div class="page">','null pointer','0x00FF3A','undefined','}catch(e){','ERR_VOID','DROP TABLE','█▓▒░▒','404','</main>','NaN','segfault','while(1){','0 1 1 0 1','throw new','..//..//'];
function makePortal(cx,cy){
  var p=el('div','portal');p.style.left=cx+'px';p.style.top=cy+'px';
  var h=el('div','hole'),c=el('div','code'),txt=[];
  for(var i=0;i<18;i++)txt.push(rnd(CODE));
  c.textContent=txt.join('\n')+'\n'+txt.join('\n');h.appendChild(c);p.appendChild(h);
  for(var j=0;j<6;j++){
    var f=el('span','fr',rnd(['<','/>','{}','0x','01','//']));var a=j/6*Math.PI*2+Math.random()*.4,r=52+Math.random()*6;
    f.style.left=(50+Math.cos(a)*r)+'%';f.style.top=(50+Math.sin(a)*r)+'%';f.style.animationDelay=(Math.random()*1.2)+'s';p.appendChild(f);
  }
  document.body.appendChild(p);void p.offsetWidth;p.classList.add('open');playPortal(true);playCreak();return p;
}
function closePortal(p){
  p.classList.remove('open');p.classList.add('closing');playPortal(false);
  setTimeout(function(){if(p.parentNode)p.parentNode.removeChild(p)},560);
}
function randPoint(cx,cy,dmin,dmax){
  var x,y,g=0,m=60;
  do{var a=Math.random()*Math.PI*2,d=dmin+Math.random()*(dmax-dmin);x=cx+Math.cos(a)*d;y=cy+Math.sin(a)*d;g++}
  while((x<m||x>innerWidth-m||y<m||y>innerHeight-m)&&g<50);
  return {x:clamp(x,m,innerWidth-m),y:clamp(y,m,innerHeight-m)};
}
function prank(){
  busy=true;killBubble();resetAuto();flashFace('p',2200);nk.frozen=true;nk.drag=false;nk.el.style.pointerEvents='none';
  var R=16*unit(),cx=nk.x+nk.w/2,cy=nk.y+nk.h/2;
  var P=randPoint(cx,cy,R*9,R*18),pa=makePortal(P.x,P.y),sx=nk.x,sy=nk.y,tx=P.x-nk.w/2,ty=P.y-nk.h/2,T0=performance.now()+700,sw0=false,suck=false;
  (function fr(now){
    var t=now-T0;
    if(t<0){requestAnimationFrame(fr);return}
    if(t<350){
      if(!sw0){sw0=true;nk.el.classList.add('struggle');playCreak()}
    }else{
      var q=clamp((t-350)/1100,0,1),e=q*q*q,sw=Math.sin(q*Math.PI*2.5)*(1-q)*36;
      if(!suck){suck=true;playSuck(false)}
      nk.x=sx+(tx-sx)*e+sw;nk.y=sy+(ty-sy)*e-Math.sin(q*Math.PI)*40;nk.a=q*420;
      nk.inner.style.transition='none';nk.inner.style.transform='scale('+(1-.95*e).toFixed(3)+')';paint();
      if(q>=1){finish();return}
    }
    requestAnimationFrame(fr);
  })(performance.now());
  function finish(){
    nk.el.classList.remove('struggle');nk.inner.style.opacity='0';
    closePortal(pa);
    setTimeout(function(){
      var Q=randPoint(cx,cy,innerWidth*.22,innerWidth*.5),pb=makePortal(Q.x,Q.y);
      nk.x=clamp(Q.x-nk.w/2,2,innerWidth-nk.w-2);nk.y=clamp(Q.y-nk.h/2,2,innerHeight-nk.h-2);nk.vx=0;nk.vy=0;nk.a=0;nk.va=0;paint();
      nk.inner.style.transition='none';nk.inner.style.transform='scale(.05) rotate(-200deg)';nk.inner.style.opacity='0';void nk.inner.offsetWidth;
      setTimeout(function(){
        nk.inner.style.transition='transform .6s cubic-bezier(.2,1.25,.4,1),opacity .4s ease';
        nk.inner.style.transform='scale(1) rotate(0deg)';nk.inner.style.opacity='1';playPop();
      },350);
      setTimeout(function(){
        closePortal(pb);nk.frozen=false;nk.el.style.pointerEvents='auto';nk.vy=-140*unit();busy=false;nk.rest=0;
        showBubble(SEQS[seqIdx++%SEQS.length],{});
      },1250);
    },800);
  }
}

/* ---------- диалог ---------- */
function showBubble(lines,opts){
  opts=opts||{};if(bubble)killBubble();
  var b=el('div','bubble'),bh=el('div','bh'),bt=el('div','bt');
  bh.appendChild(el('i'));bh.appendChild(el('i'));bh.appendChild(el('span',null,'inkee2004.exe'));
  b.appendChild(bh);b.appendChild(bt);document.body.appendChild(b);
  var me={el:b,txt:bt,dead:false};bubble=me;posBubble();void b.offsetWidth;b.classList.add('on');playGiggle();
  var li=0;
  (function next(){
    if(me.dead)return;
    if(li>=lines.length){
      if(opts.done)opts.done();
      setTimeout(function(){b.classList.remove('on');setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b);if(bubble===me){bubble=null;faceShow(false)}},320)},400);
      return;
    }
    var raw=lines[li++],mood='n',mm=/^([a-z])\|/.exec(raw);
    if(mm){mood=mm[1];raw=raw.slice(2)}
    faceSet(mood);faceShow(true);
    var line=parseLine(raw),k=0;bt.style.opacity=1;bt.textContent='';
    (function typeCh(){
      if(me.dead)return;
      if(k<line.length){
        var o=line[k++],n;
        if(o.z){n=el('span','cz',o.c);n.dataset.r=o.c}else n=document.createTextNode(o.c);
        bt.appendChild(n);if(k%3===0)playChirp();if(k%2===0){fc.i++;faceRender()}setTimeout(typeCh,30);
      }else setTimeout(function(){bt.style.opacity=0;setTimeout(next,230)},800+line.length*34);
    })();
  })();
}
function posBubble(){
  if(!bubble||!nk)return;
  var bw=bubble.el.offsetWidth,bh=bubble.el.offsetHeight,x,y;
  if(nk.mode==='perch'||nk.mode==='perchwait'||nk.mode==='land'){
    x=nk.x-bw-12;if(x<8)x=nk.x+nk.w+12;y=clamp(nk.y+nk.h-bh,8,innerHeight-bh-8);
  }else{
    x=clamp(nk.x+nk.w/2-bw/2,8,innerWidth-bw-8);y=nk.y-nk.lift-bh-14;
    if(y<8)y=nk.y+nk.h+14;
  }
  bubble.el.style.transform='translate3d('+x+'px,'+y+'px,0)';
}
addEventListener('resize',function(){refreshPlats();if(nk&&!nk.gone&&!nk.drag&&nk.mode==='phys'){var B=bounds();nk.x=clamp(nk.x,2,Math.max(2,B.maxX));nk.y=clamp(nk.y,2,Math.max(2,B.floor));paint()}});
})();
