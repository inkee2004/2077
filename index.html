<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Список модов — Cyberpunk 2077</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080c;
  --text:#e6e8ee;
  --dim:#9097a5;
  --faint:#5f6572;
  --line:rgba(236,238,245,.22);
  --line2:rgba(236,238,245,.11);
  --rh:1.55rem;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace;
  --disp:'Exo 2','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{font-size:clamp(9px,min(.8333vw,1.5625vh),22px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* ---------- фон ---------- */
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#0d0f16 0%,#07080c 60%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.b1{width:46vw;height:46vw;left:-12vw;top:-18vw;background:radial-gradient(circle,rgba(150,165,205,.20),transparent 68%);animation:d1 38s ease-in-out infinite alternate}
.b2{width:40vw;height:40vw;right:-10vw;top:12vh;background:radial-gradient(circle,rgba(190,170,210,.13),transparent 68%);animation:d2 46s ease-in-out infinite alternate}
.b3{width:50vw;height:34vw;left:22vw;bottom:-22vw;background:radial-gradient(circle,rgba(130,170,190,.14),transparent 70%);animation:d3 52s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(9vw,7vh)}}
@keyframes d2{to{transform:translate(-8vw,9vh)}}
@keyframes d3{to{transform:translate(-10vw,-6vh)}}
.grid{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(236,238,245,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(236,238,245,.028) 1px,transparent 1px);
  background-size:3rem 3rem;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 85%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 85%)}
.vig{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%)}

/* ---------- каркас ---------- */
.page{min-height:100vh;max-width:120rem;margin:0 auto;padding:1.6rem 2.5rem;display:flex;flex-direction:column;justify-content:center;gap:1.9rem}

/* ---------- верхняя полоса ---------- */
.top{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem;align-items:center;height:7.4rem}
.hd{grid-column:1;justify-self:start;display:grid;gap:.9rem;width:max-content;max-width:100%}
h1{margin:0;text-align:center;font-family:var(--disp);font-weight:600;font-size:2.5rem;line-height:1.05;letter-spacing:.1em;color:#eceef3;text-transform:uppercase;padding-left:.1em;text-shadow:0 0 1.6rem rgba(220,226,240,.18);white-space:nowrap}
.tags{width:0;min-width:100%;display:flex;gap:.35rem}
.tag{flex:1 1 auto;text-align:center;white-space:nowrap;font-family:var(--mono);font-size:.56rem;letter-spacing:.06em;text-transform:uppercase;color:#c4c9d4;border:1px solid var(--line);border-radius:999px;padding:.32rem .15rem;background:rgba(255,255,255,.03);backdrop-filter:blur(.5rem);-webkit-backdrop-filter:blur(.5rem)}
.mid{grid-column:2 / span 2;position:relative;display:flex;justify-content:center;align-items:center;height:100%}

/* ---------- поиск ---------- */
.search{position:relative;display:flex;align-items:center;gap:.65rem;width:24rem;height:2.6rem;padding:0 1.05rem;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.035);backdrop-filter:blur(.8rem);-webkit-backdrop-filter:blur(.8rem);cursor:text;
  transition:border-color .35s ease,box-shadow .35s ease,background-color .35s ease}
.search:focus-within{border-color:rgba(236,238,245,.55);background:rgba(255,255,255,.055);box-shadow:0 0 1.8rem rgba(220,228,255,.10)}
.search svg{flex:none;width:1rem;height:1rem;fill:none;stroke:var(--dim);stroke-width:1.7;stroke-linecap:round;transition:stroke .3s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.search:focus-within svg{stroke:#fff;transform:scale(1.1) rotate(-8deg)}
.field{position:relative;flex:1;height:100%;min-width:0;font-family:var(--mono);font-size:.9rem;letter-spacing:.04em}
.field input,.ghost,.ph{position:absolute;inset:0;display:flex;align-items:center;white-space:pre;font:inherit;letter-spacing:inherit;margin:0}
.field input{width:100%;border:0;outline:0;background:transparent;color:transparent;caret-color:#fff;padding:0}
.ghost{pointer-events:none;color:#eef0f5;overflow:hidden}
.ghost .g{display:inline-block;white-space:pre}
.ghost .g.in{animation:typein .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes typein{from{opacity:0;transform:translateY(.6em) scale(.8);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
.ph{pointer-events:none;color:var(--faint);transition:opacity .25s ease}
.search.has .ph{opacity:0}
.qc{flex:none;min-width:1.5rem;text-align:right;font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;color:var(--dim);transition:color .3s ease}
.search.none{border-color:rgba(236,238,245,.12)}
.search.none .qc{color:var(--faint)}
.search.none .field{animation:nope .38s ease}
@keyframes nope{25%{transform:translateX(-.25rem)}60%{transform:translateX(.2rem)}}

/* ---------- кнопка-глитч ---------- */
.gbtn{position:absolute;left:calc(50% + 12rem + 2.2rem);top:50%;width:5.4rem;height:2.1rem;margin-top:-1.05rem;padding:0;border:1px solid rgba(236,238,245,.5);border-radius:.3rem;background:rgba(255,255,255,.05);color:#eceef3;cursor:pointer;
  font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;transform:rotate(-8deg) skew(-5deg);
  clip-path:polygon(0 0,100% 0,100% 58%,91% 100%,0 100%);animation:gl 3.7s infinite steps(1);transition:background-color .25s ease}
.gbtn:hover{background:rgba(255,255,255,.1);animation-duration:1.1s}
.gbtn:active{transform:rotate(-5deg) skew(-8deg) scale(.95)}
.gbtn:focus-visible{outline:1px solid #fff;outline-offset:3px}
.gbtn .t,.gbtn .t2,.gbtn .t3{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.gbtn .t2{color:#8fe9ff;mix-blend-mode:screen;opacity:.0;animation:gl2 3.7s infinite steps(1)}
.gbtn .t3{color:#ff8fd6;mix-blend-mode:screen;opacity:.0;animation:gl3 3.7s infinite steps(1)}
.gwrap{position:absolute;left:calc(50% + 12rem + 2.2rem);top:50%;width:5.4rem;height:2.1rem;margin-top:-1.05rem;pointer-events:none}
.frag{position:absolute;left:-.55rem;top:1.55rem;width:.75rem;height:.42rem;border:1px solid rgba(236,238,245,.45);border-radius:.1rem;transform:rotate(26deg);animation:fr 4.2s infinite ease-in-out;opacity:.8}
@keyframes fr{0%,100%{transform:rotate(26deg) translateY(0)}50%{transform:rotate(34deg) translateY(.18rem)}}
@keyframes gl{0%,84%,100%{transform:rotate(-8deg) skew(-5deg)}85%{transform:translate(-3px,1px) rotate(-5deg) skew(9deg)}86%{transform:translate(4px,-1px) rotate(-11deg) skew(-11deg)}87%{transform:rotate(-8deg) skew(-5deg);opacity:.5}88%{opacity:1}93%{transform:translate(2px,0) rotate(-9deg) skew(3deg)}94%{transform:rotate(-8deg) skew(-5deg)}}
@keyframes gl2{0%,84%,100%{opacity:0}85%{opacity:.9;transform:translate(-3px,0)}86%{opacity:.9;transform:translate(2px,1px)}87%{opacity:0}93%{opacity:.8;transform:translate(-2px,0)}94%{opacity:0}}
@keyframes gl3{0%,84%,100%{opacity:0}85%{opacity:.9;transform:translate(3px,0)}86%{opacity:.9;transform:translate(-2px,-1px)}87%{opacity:0}93%{opacity:.8;transform:translate(2px,0)}94%{opacity:0}}

/* ---------- доска ---------- */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem}
.card{position:relative;display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:.6rem;padding:.2rem .5rem .5rem;
  background:rgba(255,255,255,.032);backdrop-filter:blur(1rem) saturate(1.15);-webkit-backdrop-filter:blur(1rem) saturate(1.15);
  animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.card::before,.card::after{content:"";position:absolute;width:.7rem;height:.7rem;border:1px solid rgba(255,255,255,.75);opacity:.65;pointer-events:none}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:.6rem}
.card::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-bottom-right-radius:.6rem}
@keyframes rise{from{opacity:0;transform:translateY(.7rem)}to{opacity:1;transform:none}}
.ch{display:flex;align-items:center;justify-content:space-between;gap:.6rem;height:2.3rem;padding:0 .6rem;margin-bottom:.35rem;border-bottom:1px solid var(--line2)}
.ch h2{margin:0;min-width:0;font-family:var(--disp);font-weight:600;font-size:.9rem;letter-spacing:.05em;color:#eceef3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch h2 i{font-style:normal;color:var(--faint);margin:0 .35em}
.ct{flex:none;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;color:var(--dim);border:1px solid var(--line2);border-radius:999px;padding:.12rem .55rem}
.list{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--r),var(--rh));grid-auto-columns:minmax(0,1fr);column-gap:.5rem}

/* ---------- строка мода ---------- */
a.mod{position:relative;display:flex;align-items:center;gap:.5rem;height:var(--rh);padding:0 .65rem;border-radius:.35rem;color:var(--dim);text-decoration:none;white-space:nowrap;overflow:hidden;outline:none;
  transition:color .25s ease,opacity .35s ease,background-color .35s ease}
a.mod::before{content:"";position:absolute;left:0;top:50%;width:2px;height:56%;background:#fff;border-radius:2px;transform:translateY(-50%) scaleY(0);transform-origin:center;transition:transform .28s cubic-bezier(.2,.8,.2,1);opacity:.85}
a.mod::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.10),rgba(255,255,255,0) 75%);opacity:0;transition:opacity .3s ease;pointer-events:none}
a.mod .nm{flex:1;min-width:0;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
a.mod .ar{flex:none;font-size:.78rem;opacity:0;transform:translate(-.3rem,.15rem);transition:opacity .25s ease,transform .28s cubic-bezier(.2,.8,.2,1)}
a.mod:hover,a.mod:focus-visible{color:#fff}
a.mod:hover::before,a.mod:focus-visible::before{transform:translateY(-50%) scaleY(1)}
a.mod:hover::after,a.mod:focus-visible::after{opacity:1}
a.mod:hover .nm,a.mod:focus-visible .nm{transform:translateX(.3rem)}
a.mod:hover .ar,a.mod:focus-visible .ar{opacity:.9;transform:none}
.board.focus a.mod:not(.hot){opacity:.5}

/* посимвольная подсветка поиска: глитч-вспышка, оседающая в белое свечение */
.nm .c{display:inline-block;white-space:pre}
.nm .c.m{color:#fff;text-shadow:0 0 .55rem rgba(255,255,255,.55);animation:hl .28s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0)*9ms)}
@keyframes hlout{
  0%{color:#fff;text-shadow:0 0 .55rem rgba(255,255,255,.55)}
  45%{color:#8fe9ff;text-shadow:.1em 0 #8fe9ff,-.1em 0 #ff8fd6;transform:translateY(-.1em) skewX(6deg);opacity:.7}
  100%{color:inherit;text-shadow:none;transform:none;opacity:1}
}
.nm .c.u{animation:hlout .26s ease-out both;animation-delay:calc(var(--d,0)*9ms)}
@keyframes hl{
  0%{opacity:.15;transform:translateY(.35em) skewX(-14deg);color:#8fe9ff;text-shadow:-.14em 0 #8fe9ff,.14em 0 #ff8fd6;filter:blur(2px)}
  35%{opacity:1;transform:translateY(-.12em) skewX(8deg);color:#ff8fd6;text-shadow:.12em 0 #8fe9ff,-.12em 0 #ff8fd6;filter:blur(0)}
  55%{opacity:.35;transform:translateX(.06em);color:#fff;text-shadow:none}
  70%{opacity:1;transform:none;color:#fff;text-shadow:-.06em 0 #8fe9ff,.06em 0 #ff8fd6}
  100%{opacity:1;transform:none;color:#fff;text-shadow:0 0 .55rem rgba(255,255,255,.55)}
}
a.mod.zap::after{animation:zap .7s ease-out}
@keyframes zap{0%{opacity:1;background:linear-gradient(90deg,rgba(255,255,255,.34),rgba(255,255,255,0) 85%)}100%{opacity:0}}
a.mod.sm{color:var(--text);background:rgba(255,255,255,.045)}
a.mod.sm::before{transform:translateY(-50%) scaleY(.5);opacity:.6}
.board.q a.mod:not(.sm){opacity:.42}

/* ---------- звук ---------- */
.snd{position:fixed;top:.9rem;right:1.1rem;z-index:70;font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:999px;padding:.32rem .8rem;cursor:pointer;backdrop-filter:blur(.5rem);-webkit-backdrop-filter:blur(.5rem);transition:color .25s,border-color .25s}
.snd:hover,.snd:focus-visible{color:#fff;border-color:var(--line);outline:none}
.snd[aria-pressed="false"]{opacity:.65}

/* ---------- ник, портал, диалог ---------- */
.nick{position:fixed;left:0;top:0;z-index:80;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform}
.nick.drag{cursor:grabbing}
.nick.hang{transform-origin:50% 0}
#thr{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:79;pointer-events:none;overflow:visible}
#thr line{stroke:rgba(225,232,245,.8);stroke-width:1;filter:drop-shadow(0 0 3px rgba(143,233,255,.6))}
#thr circle{fill:#e6eaf2}
.nick-in{position:relative;padding:.42rem .95rem;border:1px solid rgba(236,238,245,.6);border-radius:.4rem;background:rgba(14,15,21,.78);backdrop-filter:blur(.6rem);-webkit-backdrop-filter:blur(.6rem);color:#fff;font-family:var(--mono);font-size:.9rem;letter-spacing:.08em;white-space:nowrap;box-shadow:0 .5rem 1.4rem rgba(0,0,0,.45),0 0 1.2rem rgba(200,225,255,.12);text-shadow:-1px 0 rgba(143,233,255,.55),1px 0 rgba(255,143,214,.45)}
.nick.struggle .nick-in{animation:strug .09s linear infinite;border-color:rgba(255,90,110,.8)}
@keyframes strug{0%{transform:translate(-2px,1px) rotate(-3deg)}50%{transform:translate(2px,-1px) rotate(3deg)}100%{transform:translate(-1px,-1px) rotate(-2deg)}}
.nick.perch .nick-in{animation:sway 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(1.6deg)}}
/* цифровые лапки */
.legs{position:absolute;left:0;right:0;top:100%;height:0;opacity:0;transition:opacity .35s ease;pointer-events:none}
.nick.legs-on .legs{opacity:1}
.leg{position:absolute;top:-1px;width:1px;height:.95rem;background:#e6eaf2;box-shadow:0 0 4px rgba(143,233,255,.8);transform-origin:50% 0;transform:rotate(calc(var(--r)*1deg));animation:lg 1.15s ease-in-out infinite;animation-delay:var(--dl)}
.leg i{position:absolute;left:0;top:100%;width:1px;height:1.05rem;background:#e6eaf2;box-shadow:0 0 4px rgba(255,143,214,.7);transform-origin:50% 0;transform:rotate(calc(var(--k)*1deg))}
.nick.still .leg{animation-play-state:paused}
@keyframes lg{0%,100%{transform:rotate(calc(var(--r)*1deg))}50%{transform:rotate(calc(var(--r)*.3deg)) translateY(-.2rem)}}
/* цифровые крылья */
.wing{position:absolute;top:-30%;width:3rem;height:1.9rem;opacity:0;transition:opacity .35s ease;pointer-events:none}
.wing.l{right:100%;transform-origin:100% 70%;animation:wl .7s ease-in-out infinite alternate}
.wing.r{left:100%;transform-origin:0 70%;animation:wr .7s ease-in-out infinite alternate}
.wing svg{width:100%;height:100%;overflow:visible;fill:none;stroke:#dfe9ff;stroke-width:1;filter:drop-shadow(0 0 3px rgba(143,233,255,.85))}
.wing.r svg{transform:scaleX(-1)}
.nick.wings-on .wing{opacity:.95}
@keyframes wl{from{transform:rotate(20deg)}to{transform:rotate(-24deg)}}
@keyframes wr{from{transform:rotate(-20deg)}to{transform:rotate(24deg)}}
/* портал: тихая дыра в коде страницы */
.portal{position:fixed;z-index:75;width:6.4rem;height:6.4rem;margin:-3.2rem 0 0 -3.2rem;pointer-events:none;transform:scale(.1);opacity:0;transition:transform .6s cubic-bezier(.2,1,.3,1),opacity .45s ease;filter:drop-shadow(0 0 .9rem rgba(0,0,0,.95))}
.portal.big{width:18rem;height:18rem;margin:-9rem 0 0 -9rem}
.portal.open{transform:scale(1);opacity:1}
.portal.closing{transform:scale(.04);opacity:0;transition:transform .55s ease-in,opacity .55s ease-in}
.portal .hole{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle,#000 0,#010102 62%,#07080c 100%);animation:holej 1.2s steps(1) infinite;box-shadow:inset 0 0 1.4rem #000}
@keyframes holej{0%{clip-path:var(--h1)}34%{clip-path:var(--h2)}67%{clip-path:var(--h3)}}
.portal .code{position:absolute;left:12%;right:12%;top:0;font-family:var(--mono);font-size:.46rem;line-height:1.4;color:rgba(190,200,215,.28);white-space:pre;animation:cscroll 3.2s linear infinite;-webkit-mask:radial-gradient(circle at 50% 50%,#000 20%,transparent 70%);mask:radial-gradient(circle at 50% 50%,#000 20%,transparent 70%)}
.portal.big .code{font-size:.8rem}
@keyframes cscroll{from{transform:translateY(0)}to{transform:translateY(-50%)}}
.portal .fr{position:absolute;font-family:var(--mono);font-size:.55rem;color:rgba(200,208,222,.4);animation:frf 2.4s steps(2) infinite}
@keyframes frf{0%,100%{opacity:.5}50%{opacity:.1}}
.portal::before{content:"";position:absolute;inset:-4%;border-radius:50%;border:1px solid rgba(215,222,235,.28);animation:rg 5s linear infinite}
.portal::after{content:"";position:absolute;inset:-12%;border-radius:50%;border:1px dashed rgba(215,222,235,.14);animation:rg 9s linear infinite reverse}
@keyframes rg{to{transform:rotate(360deg)}}
/* кнопка «не жми» в боевой готовности и финальная */
.gbtn.armed{animation:shake .08s linear infinite!important;border-color:rgba(255,70,90,.95);color:#ffb3bd;background:rgba(255,40,70,.14);box-shadow:0 0 1.2rem rgba(255,40,70,.7),0 0 2.6rem rgba(255,40,70,.35)}
@keyframes shake{0%{transform:rotate(-8deg) skew(-5deg) translate(-2px,1px)}50%{transform:rotate(-7deg) skew(-5deg) translate(2px,-1px)}100%{transform:rotate(-9deg) skew(-5deg) translate(-1px,-1px)}}
.secret{position:fixed;left:50%;top:50%;z-index:90;transform:translate(-50%,-50%);padding:1.3rem 3rem;border:1px solid rgba(255,70,90,.5);border-radius:.3rem;background:rgba(10,0,4,.75);color:#ffd5da;cursor:pointer;
  font-family:var(--mono);font-size:1.5rem;letter-spacing:.42em;text-transform:uppercase;text-indent:.42em;animation:secin 1.6s cubic-bezier(.2,.8,.2,1) both,aura 2.6s ease-in-out 1.6s infinite,flick 5s steps(1) 2s infinite}
.secret::before{content:"";position:absolute;inset:-5rem -8rem;background:radial-gradient(ellipse,rgba(255,30,70,.22),rgba(110,0,60,.14) 45%,transparent 70%);z-index:-1;animation:aura2 3.4s ease-in-out infinite;pointer-events:none}
.secret:hover{color:#fff;background:rgba(40,0,10,.85)}
@keyframes secin{from{opacity:0;filter:blur(14px);transform:translate(-50%,-50%) scale(.3)}to{opacity:1;filter:blur(0);transform:translate(-50%,-50%) scale(1)}}
@keyframes aura{0%,100%{box-shadow:0 0 1.6rem rgba(255,40,70,.35),0 0 5rem rgba(120,0,50,.45),inset 0 0 1.6rem rgba(255,0,60,.1)}50%{box-shadow:0 0 2.6rem rgba(255,40,70,.6),0 0 9rem rgba(140,0,70,.6),inset 0 0 2.4rem rgba(255,0,60,.2)}}
@keyframes aura2{0%,100%{opacity:.6;transform:scale(.95)}50%{opacity:1;transform:scale(1.08)}}
@keyframes flick{0%,92%,100%{text-shadow:none;transform:translate(-50%,-50%)}93%{text-shadow:-3px 0 #8fe9ff,3px 0 #ff3b5c;transform:translate(-49.5%,-50%)}95%{text-shadow:3px 0 #8fe9ff,-3px 0 #ff3b5c;transform:translate(-50.5%,-50%)}97%{text-shadow:none;transform:translate(-50%,-50%)}}
.bgvoid .blob,.bgvoid .grid{transition:opacity 1.2s ease;opacity:.15}
.collapsing .page{pointer-events:none}
.bubble{position:fixed;left:0;top:0;z-index:85;pointer-events:none;width:20rem;border:1px solid rgba(236,238,245,.5);border-radius:.45rem;background:rgba(12,13,19,.86);backdrop-filter:blur(.8rem);-webkit-backdrop-filter:blur(.8rem);box-shadow:0 .8rem 2rem rgba(0,0,0,.5);opacity:0;transition:opacity .3s ease}
.bubble.on{opacity:1}
.bubble .bh{display:flex;align-items:center;gap:.28rem;padding:.3rem .55rem;border-bottom:1px solid var(--line2);font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;color:var(--dim)}
.bubble .bh i{width:.32rem;height:.32rem;border:1px solid var(--dim);display:inline-block}
.bubble .bh span{margin-left:auto}
.bubble .bt{padding:.6rem .7rem .7rem;min-height:4.1rem;font-family:var(--mono);font-size:.86rem;line-height:1.5;color:#e9ecf2;transition:opacity .2s ease}

/* ---------- адаптив ---------- */

      ],{duration:1300+Math.random()*300,delay:Math.random()*600,easing:'cubic-bezier(.65,0,.95,.5)',fill:'forwards'});
      else e.style.opacity=0;
    });
  },900);
  setTimeout(function(){closePortal(P)},3300);
  setTimeout(function(){
    var s=el('button','secret','засекречено');s.type='button';
    s.addEventListener('click',function(){location.href='https://youtu.be/dQw4w9WgXcQ'});
    document.body.appendChild(s);playPortal(true);
  },4100);
}
})();
</script>
