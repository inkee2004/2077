<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Список модов — Cyberpunk 2077</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080c;
  --text:#e6e8ee;
  --dim:#9097a5;
  --faint:#5f6572;
  --line:rgba(236,238,245,.22);
  --line2:rgba(236,238,245,.11);
  --rh:1.65rem;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace;
  --disp:'Exo 2','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{font-size:clamp(9px,min(.8333vw,1.5625vh),22px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* ---------- фон ---------- */
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#0d0f16 0%,#07080c 60%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.b1{width:46vw;height:46vw;left:-12vw;top:-18vw;background:radial-gradient(circle,rgba(150,165,205,.20),transparent 68%);animation:d1 38s ease-in-out infinite alternate}
.b2{width:40vw;height:40vw;right:-10vw;top:12vh;background:radial-gradient(circle,rgba(190,170,210,.13),transparent 68%);animation:d2 46s ease-in-out infinite alternate}
.b3{width:50vw;height:34vw;left:22vw;bottom:-22vw;background:radial-gradient(circle,rgba(130,170,190,.14),transparent 70%);animation:d3 52s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(9vw,7vh)}}
@keyframes d2{to{transform:translate(-8vw,9vh)}}
@keyframes d3{to{transform:translate(-10vw,-6vh)}}
.grid{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(236,238,245,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(236,238,245,.028) 1px,transparent 1px);
  background-size:3rem 3rem;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 85%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 85%)}
.vig{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%)}

/* ---------- каркас ---------- */
.page{min-height:100vh;max-width:120rem;margin:0 auto;padding:1.6rem 2.5rem;display:flex;flex-direction:column;justify-content:center;gap:1.9rem}

/* ---------- верхняя полоса ---------- */
.top{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem;align-items:center;height:7.4rem}
.hd{grid-column:1;justify-self:start;display:grid;gap:.9rem;width:max-content;max-width:100%}
h1{margin:0;text-align:center;font-family:var(--disp);font-weight:600;font-size:2.5rem;line-height:1.05;letter-spacing:.1em;color:#eceef3;text-transform:uppercase;padding-left:.1em;text-shadow:0 0 1.6rem rgba(220,226,240,.18);white-space:nowrap}
.tags{width:0;min-width:100%;display:flex;gap:.35rem}
.tag{flex:1 1 auto;text-align:center;white-space:nowrap;font-family:var(--mono);font-size:.56rem;letter-spacing:.06em;text-transform:uppercase;color:#c4c9d4;border:1px solid var(--line);border-radius:999px;padding:.32rem .15rem;background:rgba(255,255,255,.03);backdrop-filter:blur(.5rem);-webkit-backdrop-filter:blur(.5rem)}
.mid{grid-column:2 / span 2;position:relative;display:flex;justify-content:center;align-items:center;height:100%}

/* ---------- поиск ---------- */
.search{position:relative;display:flex;align-items:center;gap:.65rem;width:24rem;height:2.6rem;padding:0 1.05rem;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.035);backdrop-filter:blur(.8rem);-webkit-backdrop-filter:blur(.8rem);cursor:text;
  transition:border-color .35s ease,box-shadow .35s ease,background-color .35s ease}
.search:focus-within{border-color:rgba(236,238,245,.55);background:rgba(255,255,255,.055);box-shadow:0 0 1.8rem rgba(220,228,255,.10)}
.search svg{flex:none;width:1rem;height:1rem;fill:none;stroke:var(--dim);stroke-width:1.7;stroke-linecap:round;transition:stroke .3s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.search:focus-within svg{stroke:#fff;transform:scale(1.1) rotate(-8deg)}
.field{position:relative;flex:1;height:100%;min-width:0;font-family:var(--mono);font-size:.9rem;letter-spacing:.04em}
.field input,.ghost,.ph{position:absolute;inset:0;display:flex;align-items:center;white-space:pre;font:inherit;letter-spacing:inherit;margin:0}
.field input{width:100%;border:0;outline:0;background:transparent;color:transparent;caret-color:#fff;padding:0}
.ghost{pointer-events:none;color:#eef0f5;overflow:hidden}
.ghost .g{display:inline-block;white-space:pre}
.ghost .g.in{animation:typein .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes typein{from{opacity:0;transform:translateY(.6em) scale(.8);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
.ph{pointer-events:none;color:var(--faint);transition:opacity .25s ease}
.search.has .ph{opacity:0}
.qc{flex:none;min-width:1.5rem;text-align:right;font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;color:var(--dim);transition:color .3s ease}
.search.none{border-color:rgba(236,238,245,.12)}
.search.none .qc{color:var(--faint)}
.search.none .field{animation:nope .38s ease}
@keyframes nope{25%{transform:translateX(-.25rem)}60%{transform:translateX(.2rem)}}

/* ---------- кнопка-глитч ---------- */
.gbtn{position:absolute;left:calc(50% + 12rem + 2.2rem);top:50%;width:5.4rem;height:2.1rem;margin-top:-1.05rem;padding:0;border:1px solid rgba(236,238,245,.5);border-radius:.3rem;background:rgba(255,255,255,.05);color:#eceef3;cursor:pointer;
  font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;transform:rotate(-8deg) skew(-5deg);
  clip-path:polygon(0 0,100% 0,100% 58%,91% 100%,0 100%);animation:gl 3.7s infinite steps(1);transition:background-color .25s ease}
.gbtn:hover{background:rgba(255,255,255,.1);animation-duration:1.1s}
.gbtn:active{transform:rotate(-5deg) skew(-8deg) scale(.95)}
.gbtn:focus-visible{outline:1px solid #fff;outline-offset:3px}
.gbtn .t,.gbtn .t2,.gbtn .t3{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.gbtn .t2{color:#8fe9ff;mix-blend-mode:screen;opacity:.0;animation:gl2 3.7s infinite steps(1)}
.gbtn .t3{color:#ff8fd6;mix-blend-mode:screen;opacity:.0;animation:gl3 3.7s infinite steps(1)}
.gwrap{position:absolute;left:calc(50% + 12rem + 2.2rem);top:50%;width:5.4rem;height:2.1rem;margin-top:-1.05rem;pointer-events:none}
.frag{position:absolute;left:-.55rem;top:1.55rem;width:.75rem;height:.42rem;border:1px solid rgba(236,238,245,.45);border-radius:.1rem;transform:rotate(26deg);animation:fr 4.2s infinite ease-in-out;opacity:.8}
@keyframes fr{0%,100%{transform:rotate(26deg) translateY(0)}50%{transform:rotate(34deg) translateY(.18rem)}}
@keyframes gl{0%,84%,100%{transform:rotate(-8deg) skew(-5deg)}85%{transform:translate(-3px,1px) rotate(-5deg) skew(9deg)}86%{transform:translate(4px,-1px) rotate(-11deg) skew(-11deg)}87%{transform:rotate(-8deg) skew(-5deg);opacity:.5}88%{opacity:1}93%{transform:translate(2px,0) rotate(-9deg) skew(3deg)}94%{transform:rotate(-8deg) skew(-5deg)}}
@keyframes gl2{0%,84%,100%{opacity:0}85%{opacity:.9;transform:translate(-3px,0)}86%{opacity:.9;transform:translate(2px,1px)}87%{opacity:0}93%{opacity:.8;transform:translate(-2px,0)}94%{opacity:0}}
@keyframes gl3{0%,84%,100%{opacity:0}85%{opacity:.9;transform:translate(3px,0)}86%{opacity:.9;transform:translate(-2px,-1px)}87%{opacity:0}93%{opacity:.8;transform:translate(2px,0)}94%{opacity:0}}

/* ---------- панель описания ---------- */
.info{grid-column:4;align-self:stretch;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:.7rem .95rem;border:1px solid var(--line);border-radius:.6rem;
  background:rgba(255,255,255,.032);backdrop-filter:blur(1rem) saturate(1.15);-webkit-backdrop-filter:blur(1rem) saturate(1.15)}
.info::before,.info::after{content:"";position:absolute;width:.7rem;height:.7rem;border:1px solid rgba(255,255,255,.75);opacity:.65;pointer-events:none}
.info::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:.6rem}
.info::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-bottom-right-radius:.6rem}
.i-body{display:flex;flex-direction:column;gap:.28rem;transition:opacity .3s ease,transform .36s cubic-bezier(.2,.8,.2,1)}
.info.out .i-body{opacity:0;transform:translateY(.4rem)}
.info.idle .i-name{color:var(--dim)}
.info.idle .i-desc{color:var(--faint)}
.i-cat{font-family:var(--mono);font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.i-name{font-family:var(--disp);font-weight:600;font-size:1rem;letter-spacing:.02em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s ease}
.i-desc{margin:0;min-height:4.35em;font-size:.76rem;line-height:1.45;color:#cdd1da;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;transition:color .3s ease}

/* ---------- доска ---------- */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem}
.card{position:relative;display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:.6rem;padding:.2rem .5rem .5rem;
  background:rgba(255,255,255,.032);backdrop-filter:blur(1rem) saturate(1.15);-webkit-backdrop-filter:blur(1rem) saturate(1.15);
  animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.card::before,.card::after{content:"";position:absolute;width:.7rem;height:.7rem;border:1px solid rgba(255,255,255,.75);opacity:.65;pointer-events:none}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:.6rem}
.card::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-bottom-right-radius:.6rem}
@keyframes rise{from{opacity:0;transform:translateY(.7rem)}to{opacity:1;transform:none}}
.ch{display:flex;align-items:center;justify-content:space-between;gap:.6rem;height:2.3rem;padding:0 .6rem;margin-bottom:.35rem;border-bottom:1px solid var(--line2)}
.ch h2{margin:0;min-width:0;font-family:var(--disp);font-weight:600;font-size:.9rem;letter-spacing:.05em;color:#eceef3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch h2 i{font-style:normal;color:var(--faint);margin:0 .35em}
.ct{flex:none;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;color:var(--dim);border:1px solid var(--line2);border-radius:999px;padding:.12rem .55rem}
.list{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--r),var(--rh));grid-auto-columns:minmax(0,1fr);column-gap:.5rem}

/* ---------- строка мода ---------- */
a.mod{position:relative;display:flex;align-items:center;gap:.5rem;height:var(--rh);padding:0 .65rem;border-radius:.35rem;color:var(--dim);text-decoration:none;white-space:nowrap;overflow:hidden;outline:none;
  transition:color .25s ease,opacity .35s ease,background-color .35s ease}
a.mod::before{content:"";position:absolute;left:0;top:50%;width:2px;height:56%;background:#fff;border-radius:2px;transform:translateY(-50%) scaleY(0);transform-origin:center;transition:transform .28s cubic-bezier(.2,.8,.2,1);opacity:.85}
a.mod::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.10),rgba(255,255,255,0) 75%);opacity:0;transition:opacity .3s ease;pointer-events:none}
a.mod .nm{flex:1;min-width:0;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
a.mod .ar{flex:none;font-size:.78rem;opacity:0;transform:translate(-.3rem,.15rem);transition:opacity .25s ease,transform .28s cubic-bezier(.2,.8,.2,1)}
a.mod:hover,a.mod:focus-visible{color:#fff}
a.mod:hover::before,a.mod:focus-visible::before{transform:translateY(-50%) scaleY(1)}
a.mod:hover::after,a.mod:focus-visible::after{opacity:1}
a.mod:hover .nm,a.mod:focus-visible .nm{transform:translateX(.3rem)}
a.mod:hover .ar,a.mod:focus-visible .ar{opacity:.9;transform:none}
.board.focus a.mod:not(.hot):not(.rel){opacity:.5}
a.mod.rel{color:#fff}
a.mod.rel::before{transform:translateY(-50%) scaleY(.5);opacity:.6}

/* посимвольная подсветка поиска */
.nm .c{background:linear-gradient(currentColor,currentColor) 0 100%/0% 1px no-repeat;transition:color .38s ease,text-shadow .38s ease,background-size .38s ease;transition-delay:calc(var(--d,0)*26ms)}
.nm .c.m{color:#fff;text-shadow:0 0 .6rem rgba(255,255,255,.6);background-size:100% 1px}
a.mod.sm{color:var(--text);background:rgba(255,255,255,.045)}
a.mod.sm::before{transform:translateY(-50%) scaleY(.5);opacity:.6}
.board.q a.mod:not(.sm){opacity:.42}

/* ---------- нити связей ---------- */
#threads{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:40;pointer-events:none;overflow:visible}
#threads g{filter:drop-shadow(0 0 3px rgba(150,205,255,.75)) drop-shadow(0 0 9px rgba(150,205,255,.32));transition:opacity .24s ease}
.th{fill:none;stroke:rgba(205,230,255,.92);stroke-width:1.15;stroke-linecap:round}
.dot{fill:#fff}
.node{fill:rgba(205,230,255,.95)}

/* ---------- звук ---------- */
.snd{position:fixed;top:.9rem;right:1.1rem;z-index:70;font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:999px;padding:.32rem .8rem;cursor:pointer;backdrop-filter:blur(.5rem);-webkit-backdrop-filter:blur(.5rem);transition:color .25s,border-color .25s}
.snd:hover,.snd:focus-visible{color:#fff;border-color:var(--line);outline:none}
.snd[aria-pressed="false"]{opacity:.65}

/* ---------- ник, портал, диалог ---------- */
.nick{position:fixed;left:0;top:0;z-index:80;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform}
.nick.drag{cursor:grabbing}
.nick-in{padding:.42rem .95rem;border:1px solid rgba(236,238,245,.6);border-radius:.4rem;background:rgba(14,15,21,.78);backdrop-filter:blur(.6rem);-webkit-backdrop-filter:blur(.6rem);color:#fff;font-family:var(--mono);font-size:.9rem;letter-spacing:.08em;white-space:nowrap;box-shadow:0 .5rem 1.4rem rgba(0,0,0,.45),0 0 1.2rem rgba(200,225,255,.12);text-shadow:-1px 0 rgba(143,233,255,.55),1px 0 rgba(255,143,214,.45)}
.portal{position:fixed;z-index:75;width:6rem;height:6rem;margin:-3rem 0 0 -3rem;pointer-events:none;border-radius:50%;transform:scale(.1);opacity:0;transition:transform .42s cubic-bezier(.2,1.2,.4,1),opacity .3s ease}
.portal.open{transform:scale(1);opacity:1}
.portal.closing{transform:scale(.05);opacity:0;transition:transform .38s ease-in,opacity .38s ease-in}
.portal::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,255,255,0),rgba(255,255,255,.95),rgba(143,233,255,.5),rgba(255,143,214,.35),rgba(255,255,255,0));
  -webkit-mask:radial-gradient(circle,transparent 52%,#000 56%,#000 68%,transparent 72%);mask:radial-gradient(circle,transparent 52%,#000 56%,#000 68%,transparent 72%);animation:spin 1.1s linear infinite;filter:drop-shadow(0 0 .5rem rgba(200,230,255,.8))}
.portal::after{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle,rgba(5,6,10,.95) 30%,rgba(20,25,40,.6) 70%,transparent);box-shadow:0 0 1.6rem rgba(160,210,255,.35) inset}
@keyframes spin{to{transform:rotate(360deg)}}
.bubble{position:fixed;left:0;top:0;z-index:85;pointer-events:none;width:17rem;border:1px solid rgba(236,238,245,.5);border-radius:.45rem;background:rgba(12,13,19,.86);backdrop-filter:blur(.8rem);-webkit-backdrop-filter:blur(.8rem);box-shadow:0 .8rem 2rem rgba(0,0,0,.5);opacity:0;transition:opacity .3s ease}
.bubble.on{opacity:1}
.bubble .bh{display:flex;align-items:center;gap:.28rem;padding:.3rem .55rem;border-bottom:1px solid var(--line2);font-family:var(--mono);font-size:.55rem;letter-spacing:.12em;color:var(--dim)}
.bubble .bh i{width:.32rem;height:.32rem;border:1px solid var(--dim);display:inline-block}
.bubble .bh span{margin-left:auto}
.bubble .bt{padding:.6rem .7rem .7rem;min-height:3.1rem;font-family:var(--mono);font-size:.7rem;line-height:1.5;color:#e9ecf2;transition:opacity .2s ease}

/* ---------- адаптив ---------- */
@media (max-width:1000px){
  html{font-size:15px}
  .page{padding:3.2rem 1rem 2rem;justify-content:flex-start}
  .top{display:flex;flex-direction:column;height:auto;gap:1.2rem;align-items:stretch}
  .hd{align-self:center}
  .mid{height:3.2rem}
  .info{min-height:7.4rem}
  .board{grid-template-columns:minmax(0,1fr)}
  .card{grid-column:auto!important}
  .list{grid-auto-flow:row;grid-template-rows:none;grid-auto-rows:var(--rh)}
  h1{font-size:2rem}
  .gbtn,.gwrap{left:calc(50% + 12rem + .8rem)}
}
@media (max-width:640px){.search{width:min(24rem,70vw)}.gbtn,.gwrap{left:auto;right:0}}
@media (prefers-reduced-motion:reduce){
  .blob,.card,.gbtn,.gbtn .t2,.gbtn .t3,.frag{animation:none!important}
  a.mod,a.mod *,.info *{transition-duration:.01s!important}
}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="grid"></div><div class="vig"></div>
<svg id="threads" aria-hidden="true"><g id="thg"></g></svg>
<button class="snd" id="snd" type="button" aria-pressed="true" title="Звук включится после первого клика по странице">Звук · вкл</button>

<main class="page">
  <header class="top">
    <div class="hd">
      <h1>Список модов</h1>
      <div class="tags" id="tags"></div>
    </div>
    <div class="mid">
      <label class="search" id="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.6"/><path d="M13 13l4.2 4.2"/></svg>
        <div class="field">
          <span class="ph">Найти мод</span>
          <div class="ghost" id="ghost" aria-hidden="true"></div>
          <input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="30" aria-label="Поиск мода по названию">
        </div>
        <span class="qc" id="qc"></span>
      </label>
      <div class="gwrap"><span class="frag"></span></div>
      <button class="gbtn" id="gbtn" type="button" aria-label="Кнопка с сюрпризом">
        <span class="t">Не жми</span><span class="t2" aria-hidden="true">Не жми</span><span class="t3" aria-hidden="true">Не жми</span>
      </button>
    </div>
    <aside class="info idle" id="info" aria-live="polite">
      <div class="i-body">
        <span class="i-cat" id="iCat">Информация</span>
        <span class="i-name" id="iName">Наведи на мод</span>
        <p class="i-desc" id="iDesc">Здесь появится описание: что именно делает мод. От выбранного мода потянутся нити к связанным с ним модам.</p>
      </div>
    </aside>
  </header>
  <section class="board" id="board" aria-label="Список модов по категориям"></section>
</main>

<script>
(function(){
'use strict';
var root=document.documentElement;
function unit(){return parseFloat(getComputedStyle(root).fontSize)/16}
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= ДАННЫЕ =================
   [название, id на Nexus, [требует], [связан с]]
   Категории идут в том порядке, в котором они указаны в TXT. */
var CATS=[
 {t:['Обязательные фреймворки'],span:1,rows:9,mods:[
  ['ArchiveXL',4198,['RED4ext'],[]],
  ['Browser Extension',10038,[],['Virtual Atelier']],
  ['Codeware',7780,['RED4ext'],['redscript']],
  ['Cyber Engine Tweaks',107,[],[]],
  ['Mod Settings',4885,['RED4ext','redscript'],[]],
  ['Native Settings UI',3518,['Cyber Engine Tweaks'],[]],
  ['RED4ext',2380,[],[]],
  ['redscript',1511,[],[]],
  ['TweakXL',4197,['RED4ext'],[]]
 ]},
 {t:['Исправления','Стабильность'],span:3,rows:10,mods:[
  ['3D World Map Fixed',26500,[],[]],
  ['Accidental fast travel bug fix',36600,[],['Fast Travel from anywhere to everywhere']],
  ['Bug Fix - Recon Grenade Bouce Fix',14163,[],[]],
  ['Crafting Recipe Owned and Iconic Labels',11261,[],[]],
  ['Decals Flickering Fix',16579,[],[]],
  ['Disappearing Enemy Health Bar Fix',19815,[],['HUD Fixes']],
  ['Disappearing NPC and Vehicle Fix',19628,[],[]],

/* кнопка: забавный глитч-звук */
function playGlitch(){
  if(!can())return;var t=ctx.currentTime,N=[880,660,1175,494,1318,740];
  N.forEach(function(f,i){voice('triangle',f,f*(i%2?.8:1.15),t+i*.05,.032,.07,false)});
  noise(t+.02,.014,.28,'bandpass',2400,900,2);
  voice('sine',520,170,t+.32,.045,.34,true);
}
function playPop(){if(!can())return;var t=ctx.currentTime;voice('sine',300,720,t,.05,.14,true);noise(t,.012,.07,'highpass',3000,0,1)}
function playGrab(){if(!can())return;var t=ctx.currentTime;voice('sine',700,980,t,.025,.1,true);noise(t,.008,.05,'bandpass',3000,0,1)}
function playWhoosh(k){if(!can())return;var t=ctx.currentTime;noise(t,.03*k,.3,'bandpass',500,1800,1.4)}
function playThump(k){
  if(!can())return;var t=ctx.currentTime;if(t-lastThump<.07)return;lastThump=t;
  voice('sine',170,70,t,.06*k,.18,false);noise(t,.012*k,.05,'lowpass',500,0,1);
}
function playPortal(open){
  if(!can())return;var t=ctx.currentTime;
  if(open){voice('sine',220,640,t,.04,.5,true);voice('sine',330,960,t,.018,.5,true)}
  else{voice('sine',620,190,t,.04,.42,true)}
  noise(t,.012,.4,'bandpass',open?600:1400,open?2200:400,1.5);
}
function playChirp(){if(!can())return;var t=ctx.currentTime,f=520+Math.random()*340;voice('triangle',f,f*1.18,t,.018,.07,true)}
function playGiggle(){
  if(!can())return;var t=ctx.currentTime;
  [0,1,2,3].forEach(function(i){voice('triangle',700+(i%2)*160,820+(i%2)*160,t+i*.085,.022,.07,true)});
}

/* ================= ВЕРХНЯЯ КНОПКА, НИК, ФИЗИКА, ПОРТАЛЫ ================= */
var gbtn=document.getElementById('gbtn'),nk=null,loopOn=false,lastT=0,busy=false,bubble=null,grabs=0,lastPrank=-9;
var SEQS=[
 ['хе-хе, поймать меня решил?','даже на странице про Киберпанк бывают баги.','а эти — неподконтрольны даже мне.'],
 ['упс. портал сработал сам.','я его не включал, честно.','это не баг. это... киберпсихоз страницы.'],
 ['ты думал, всё под контролем?','в Найт-Сити даже нику нельзя доверять.','баги тут сильнее создателя.']
];
var seqIdx=Math.floor(Math.random()*SEQS.length);
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function ensureNick(){
  if(nk)return nk;
  var e=el('div','nick'),inn=el('div','nick-in','inkee2004');e.appendChild(inn);document.body.appendChild(e);
  nk={el:e,inner:inn,x:0,y:0,vx:0,vy:0,a:0,va:0,w:0,h:0,drag:false,frozen:false,ox:0,oy:0,lt:0,pid:null};
  e.addEventListener('pointerdown',onNickDown);
  e.addEventListener('pointermove',onNickMove);
  e.addEventListener('pointerup',onNickUp);
  e.addEventListener('pointercancel',onNickUp);
  return nk;
}
function paint(){nk.el.style.transform='translate3d('+nk.x+'px,'+nk.y+'px,0) rotate('+nk.a+'deg)'}
function spawnNick(){
  ensureNick();var u=unit();
  var b=gbtn.getBoundingClientRect();
  nk.w=nk.el.offsetWidth;nk.h=nk.el.offsetHeight;
  nk.x=b.left+b.width/2-nk.w/2;nk.y=b.top+b.height*.55;
  nk.vx=(40+Math.random()*90)*u;nk.vy=-(290+Math.random()*70)*u;nk.a=-14;nk.va=70;nk.frozen=false;nk.drag=false;
  nk.inner.style.transition='none';nk.inner.style.transform='scale(.3)';nk.inner.style.opacity='0';void nk.inner.offsetWidth;
  nk.inner.style.transition='transform .55s cubic-bezier(.2,1.3,.4,1),opacity .35s ease';nk.inner.style.transform='scale(1)';nk.inner.style.opacity='1';
  nk.el.style.pointerEvents='auto';paint();playPop();
  if(!loopOn){loopOn=true;lastT=performance.now();requestAnimationFrame(loop)}
}
gbtn.addEventListener('click',function(){
  if(busy)return;
  playGlitch();
  setTimeout(spawnNick,520);
});
function loop(t){
  var dt=Math.min(.033,Math.max(.001,(t-lastT)/1000));lastT=t;
  if(nk)step(dt);
  requestAnimationFrame(loop);
}
function bounds(){return {maxX:innerWidth-nk.w-2,floor:innerHeight-nk.h-2}}
function step(dt){
  if(nk.frozen){posBubble();return}
  var u=unit(),B=bounds();
  if(nk.drag){
    nk.a+=(clamp(nk.vx*.012,-22,22)-nk.a)*Math.min(1,dt*10);
    paint();posBubble();return;
  }
  nk.vy+=950*u*dt;
  nk.vx*=Math.pow(.55,dt);nk.vy*=Math.pow(.8,dt);
  nk.x+=nk.vx*dt;nk.y+=nk.vy*dt;nk.a+=nk.va*dt;nk.va*=Math.pow(.25,dt);
  if(nk.x<2){nk.x=2;if(Math.abs(nk.vx)>120*u)playThump(clamp(Math.abs(nk.vx)/(900*u),.2,1));nk.vx=Math.abs(nk.vx)*.5}
  if(nk.x>B.maxX){nk.x=B.maxX;if(Math.abs(nk.vx)>120*u)playThump(clamp(Math.abs(nk.vx)/(900*u),.2,1));nk.vx=-Math.abs(nk.vx)*.5}
  if(nk.y<2){nk.y=2;nk.vy=Math.abs(nk.vy)*.4}
  var onFloor=false;
  if(nk.y>=B.floor){
    nk.y=B.floor;var imp=nk.vy;
    if(imp>110*u)playThump(clamp(imp/(1100*u),.2,1));
    nk.vy=-imp*.38;if(Math.abs(nk.vy)<70*u)nk.vy=0;
    nk.vx*=.84;nk.va+=nk.vx*.04;onFloor=nk.vy===0;
  }
  if(onFloor||(nk.y>=B.floor-.5&&nk.vy===0)){
    nk.vx*=Math.pow(.02,dt);nk.va*=Math.pow(.02,dt);nk.a+=(0-nk.a)*Math.min(1,dt*5);
  }
  paint();posBubble();
}
var vhist=0;
function onNickDown(e){
  if(busy||nk.frozen||e.button>0)return;
  e.preventDefault();grabs++;
  if(!bubble&&grabs>=2&&grabs-lastPrank>=2&&Math.random()<.34){lastPrank=grabs;prank();return}
  nk.drag=true;nk.el.classList.add('drag');nk.pid=e.pointerId;
  try{nk.el.setPointerCapture(e.pointerId)}catch(x){}
  nk.ox=e.clientX-nk.x;nk.oy=e.clientY-nk.y;nk.lt=performance.now();nk.vx=0;nk.vy=0;playGrab();
}
function onNickMove(e){
  if(!nk.drag||e.pointerId!==nk.pid)return;
  var now=performance.now(),dt=(now-nk.lt)/1000;
  var nx=clamp(e.clientX-nk.ox,2,innerWidth-nk.w-2),ny=clamp(e.clientY-nk.oy,2,innerHeight-nk.h-2);
  if(dt>0){nk.vx=nk.vx*.6+((nx-nk.x)/dt)*.4;nk.vy=nk.vy*.6+((ny-nk.y)/dt)*.4}
  nk.x=nx;nk.y=ny;nk.lt=now;
}
function onNickUp(e){
  if(!nk.drag||e.pointerId!==nk.pid)return;
  var u=unit(),cap=2600*u;
  nk.drag=false;nk.el.classList.remove('drag');
  if(performance.now()-nk.lt>90){nk.vx*=.2;nk.vy*=.2}
  nk.vx=clamp(nk.vx,-cap,cap);nk.vy=clamp(nk.vy,-cap,cap);
  var sp=Math.sqrt(nk.vx*nk.vx+nk.vy*nk.vy);
  nk.va=nk.vx*.05;
  if(sp>350*u)playWhoosh(clamp(sp/(1800*u),.3,1));else playGrab();
  try{nk.el.releasePointerCapture(e.pointerId)}catch(x){}
}
function makePortal(cx,cy){
  var p=el('div','portal');p.style.left=cx+'px';p.style.top=cy+'px';document.body.appendChild(p);
  void p.offsetWidth;p.classList.add('open');playPortal(true);return p;
}
function closePortal(p){
  p.classList.remove('open');p.classList.add('closing');playPortal(false);
  setTimeout(function(){if(p.parentNode)p.parentNode.removeChild(p)},420);
}
function prank(){
  busy=true;nk.frozen=true;nk.drag=false;nk.el.style.pointerEvents='none';
  var u=unit(),cx=nk.x+nk.w/2,cy=nk.y+nk.h/2;
  var pa=makePortal(cx,cy);
  setTimeout(function(){
    nk.inner.style.transition='transform .52s cubic-bezier(.55,0,.85,.3),opacity .5s ease-in';
    nk.inner.style.transform='scale(.05) rotate(220deg)';nk.inner.style.opacity='0';
  },300);
  setTimeout(function(){closePortal(pa)},880);
  setTimeout(function(){
    var tx,ty,guard=0;
    do{tx=innerWidth*(.12+Math.random()*.76);ty=innerHeight*(.3+Math.random()*.45);guard++}
    while(Math.hypot(tx-cx,ty-cy)<innerWidth*.25&&guard<30);
    var pb=makePortal(tx,ty);
    nk.x=clamp(tx-nk.w/2,2,innerWidth-nk.w-2);nk.y=clamp(ty-nk.h/2,2,innerHeight-nk.h-2);nk.vx=0;nk.vy=0;nk.a=0;nk.va=0;paint();
    nk.inner.style.transition='none';nk.inner.style.transform='scale(.05) rotate(-200deg)';nk.inner.style.opacity='0';void nk.inner.offsetWidth;
    setTimeout(function(){
      nk.inner.style.transition='transform .6s cubic-bezier(.2,1.25,.4,1),opacity .4s ease';
      nk.inner.style.transform='scale(1) rotate(0deg)';nk.inner.style.opacity='1';playPop();
    },320);
    setTimeout(function(){
      closePortal(pb);nk.frozen=false;nk.el.style.pointerEvents='auto';nk.vy=-140*u;busy=false;
      showBubble(SEQS[seqIdx++%SEQS.length]);
    },1150);
  },1250);
}
function showBubble(lines){
  if(bubble)return;
  var b=el('div','bubble'),bh=el('div','bh'),bt=el('div','bt');
  bh.appendChild(el('i'));bh.appendChild(el('i'));bh.appendChild(el('span',null,'inkee2004.exe'));
  b.appendChild(bh);b.appendChild(bt);document.body.appendChild(b);
  bubble={el:b,txt:bt};posBubble();void b.offsetWidth;b.classList.add('on');playGiggle();
  var li=0;
  (function next(){
    if(li>=lines.length){
      setTimeout(function(){b.classList.remove('on');setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b);bubble=null},320)},1500);
      return;
    }
    var line=lines[li++],k=0;bt.style.opacity=1;bt.textContent='';
    (function typeCh(){
      if(k<line.length){bt.textContent+=line.charAt(k++);if(k%3===0)playChirp();setTimeout(typeCh,30)}
      else setTimeout(function(){bt.style.opacity=0;setTimeout(next,230)},1500);
    })();
  })();
}
function posBubble(){
  if(!bubble||!nk)return;
  var bw=bubble.el.offsetWidth,bh=bubble.el.offsetHeight;
  var x=clamp(nk.x+nk.w/2-bw/2,8,innerWidth-bw-8),y=nk.y-bh-14;
  if(y<8)y=nk.y+nk.h+14;
  bubble.el.style.transform='translate3d('+x+'px,'+y+'px,0)';
}
addEventListener('resize',function(){if(nk&&!nk.drag){var B=bounds();nk.x=clamp(nk.x,2,Math.max(2,B.maxX));nk.y=clamp(nk.y,2,Math.max(2,B.floor));paint()}});
})();
</script>
</body>
